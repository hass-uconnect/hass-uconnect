name: Validate Integration

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  validate:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "integration"

      - name: HASS validation
        uses: home-assistant/actions/hassfest@master
